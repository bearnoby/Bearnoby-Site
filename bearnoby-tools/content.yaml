# All text for the Bearnoby Tools page lives here. Edit this file, then run
# .\run.ps1 (or push to main) and the page is rebuilt from it.
#
# - Text may contain basic HTML (<a href="...">, <b>, <br>). Write &amp; for a literal &.
# - Image paths are relative to the bearnoby-tools/ folder (e.g. img/2-triggers.png).
# - Order in each list is the order on the page.
# - Anything marked TODO is placeholder copy that still needs real content.

page:
  title: Bearnoby Tools
  description: Streaming tools are either overcomplicated or expensive. I'm trying to fix that.
  badges: []               # optional pills next to the title, e.g. - { text: BETA, style: default }

# The lavender announcement under the page title. Set enabled: false to hide it.
announcement:
  enabled: true
  addon: tts-pets          # id of an entry under premium.addons; the announcement links to it
  pill: "SOON"                 # small red tag before the text, e.g. NEW. Empty string hides it.
  text: TTS Pets is coming soon!   # the announcement itself (basic HTML allowed)

overview:
  hero_image: img/bearnoby-tools.png
  hero_alt: Bearnoby Tools feature overview
  intro: >-
    Navigating OBS setup can be an exhausting mess of different websites and applications.
    I built Bearnoby Tools to change that.
  download:
    heading: Now Available!
    button: { text: Download for Free on Itch.io, url: "https://bearnoby.itch.io/bearnoby-tools" }
    support_text: If you like what I do, you can also support development on Ko-fi.
    links:
      - { text: Discord, url: "https://discord.gg/bNMjbB7C8e" }
      - { text: Email Me, url: "mailto:bearnoby@gmail.com" }
      - { text: Ko-fi, url: "https://ko-fi.com/bearnoby" }

# Sidebar groups for the free features. Each feature's `group` must match a group id.
feature_groups:
  - { id: chat, name: Chat }
  - { id: alerts, name: Alerts }
  - { id: triggers, name: Triggers }
  - { id: chat-commands, name: Commands }
  - { id: timers-counters, name: Timers &amp; counters }
  - { id: feature-management, name: Feature Management}

