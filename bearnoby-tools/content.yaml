about:
  philosophy_heading: Design Philosophy
  philosophy_intro: >-
    I wish I could say there was some grand plan here, but realistically I just build shit
    as I or my friends needed or request it. If I was to sum up the design philosophy though, 
    it's as follows:
  philosophy_points:
    - I build features as I (or others) need it
    - Make the basics so simple a baby could use it, and gate complexity in extras
    - As much as possible should run locally on your PC rather than relying on third party websites
    - Anything "staple" to running a stream is free out of the box, forever

faq:
  - q: Who are you?
    a:
      - I'm that fuck-ass bear at <a href="http://twitch.tv/bearnoby" target="_blank">twitch.tv/bearnoby</a>

  - q: Why're you doing this?
    a:
      - Recently, when overhauling my stream, I realized how much of a pain in the ass the whole process is. I was relying on like, six or seven different tools and services just to keep things running.
      - I had one site for redeems, another platform for alerts, two for different chat boxes, complex third-party software for command integration, and another service for shout-outs and break screens.
      - It's just a mess &mdash; my setup isn't even that complicated and a lot of these features are standard for practically every streamer. Half the reason it ends up like this is because platforms love to paywall basic tools behind monthly subscriptions, forcing you to frankenstein together free tiers from six different sites just to get a functional stream running.
      - On top of the bloat, trying to set up a simple easter egg like playing a specific sound or video when someone says a certain trigger phrase in chat was ridiculously complicated. I even ran into a situation where a super basic feature I wanted was actively paywalled and there was no other available alternative, which was absurd to me because it's like the easiest thing in the world to implement.
      - I got sick of it and have the expertise to build this shit myself so I did.

  - q: No, I mean why are you doing this to me?
    a:
      - What, making you set up OBS again? Trust me it'll probably be worth it, I'm a trustworthy bear.

  - q: You're dodging the question
    a:
      - No I'm not. I have no idea what you're talking about, you must be crazy.

  - q: You're gaslighting me
    a:
      - Gaslighting isn't a real word, you made that up.

