    title: Native 7TV integration
    image: img/chat-7tv.png
    text: "Set up your 7TV emotes and they can be natively imported and used in BearnobyTools."

  - id: alerts-simple
    group: alerts
    title: Alerts
    image: img/alerts-simple.png
