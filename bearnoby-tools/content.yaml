# Start audit required section

  - id: triggers
    group: triggers
    title: Media triggers
    image: img/2-triggers.png
    text: Set chat or redeem-based triggers for media

  - id: triggerboard
    group: triggers
    title: Triggerboard
    image: img/2a-triggerboard.png
    text: Optional Triggerboard to fire off media like a soundboard

  - id: commands
    group: chat-commands
    title: Text commands
    image: img/3-commands.png
    text: Set up basic text commands that respond on your account or a secondary bot account

  - id: queue
    group: chat-commands
    title: Viewer queue
    image: img/8-viewer-queue.png
    text: Simple joinable viewer queue integrated with chat

  - id: timers
    group: timers-counters
    title: Timers
    image: img/4-timers.png
    text: Timers for subathons, gameplay, etc with easily configurable chat, redeem, donation, sub, etc integration

  - id: counters
    group: timers-counters
    title: Counters
    image: img/7-counters.png
    text: Persistent configurable counters with custom styling

# End Audit required section

  - id: feature-toggles
    group: feature-management
    title: Feature Toggles
    image: img/feature-control.png
    text: >-
      Keep the UX as clean and minimal as possible by enabling only what you actually use. 
      The rest remain hidden.

