  - id: chat-advancedchat
    group: chat
    title: Advanced chat boxes
    image: img/chat-advancedchat.png
    text: "Advanced custom chatbox creation."

  - id: chat-customcode
    group: chat
    title: Custom code skin chat boxes
    image: img/chat-customcode.png
    text: "Full custom code chatboxes with placeholder templating and configurable parameters."

  - id: chat-filtering
    group: chat
    title: Message filtering
    image: img/chat-filtering.png
    text: "Filter out certain messages or users"

  - id: chatbox-7tv
